services:
  sms-gateway-backend:
    build: .
    container_name: sms_gateway_backend
    restart: always
    ports:
      - "127.0.0.1:8088:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - PROJECT_NAME=${PROJECT_NAME:-SMS Gateway API}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/sms_gateway.db}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SECRET_KEY=${SECRET_KEY:-sms-gateway-secret-key-change-me-in-production-9988}
    volumes:
      - sms_gateway_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sms_gateway_data:
